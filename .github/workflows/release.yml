name: Publish release

on:
  workflow_call:
    inputs:
      publish_chrome:
        type: boolean
        default: true
      publish_firefox:
        type: boolean
        default: true
      create_release:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      chrome_cancel_pending:
        type: boolean
        default: true

    secrets:
      CHROME_EXTENSION_ID:
        required: true
      CHROME_PUBLISHER_ID:
        required: true
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
        required: true
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
        required: true

      FIREFOX_JWT_ISSUER:
        required: true
      FIREFOX_JWT_SECRET:
        required: true

  workflow_dispatch:
    inputs:
      publish_chrome:
        description: Publish to Chrome Web Store
        type: boolean
        default: true

      publish_firefox:
        description: Publish to Firefox Add-ons
        type: boolean
        default: false

      create_release:
        description: Create or update GitHub Release
        type: boolean
        default: false

      dry_run:
        description: Validate configuration without publishing
        type: boolean
        default: false

      chrome_cancel_pending:
        description: Cancel pending Chrome review before publishing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension packages
        run: pnpm package

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Chrome package:  .output/avy-tab-switcher-$VERSION-chrome.zip"
          echo "Firefox package: .output/avy-tab-switcher-$VERSION-firefox.zip"
          echo "Sources package: .output/avy-tab-switcher-$VERSION-sources.zip"

      - name: Publish Chrome
        if: ${{ inputs.publish_chrome }}
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_CANCEL_PENDING: ${{ inputs.chrome_cancel_pending }}

        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          args=(
            --chrome-zip
            ".output/avy-tab-switcher-$VERSION-chrome.zip"
          )

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          pnpm exec wxt submit "${args[@]}"

      - name: Publish Firefox
        if: ${{ inputs.publish_firefox }}
        env:
          FIREFOX_EXTENSION_ID: avy-tab-switcher
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          args=(
            --firefox-zip
            ".output/avy-tab-switcher-$VERSION-firefox.zip"
            --firefox-sources-zip
            ".output/avy-tab-switcher-$VERSION-sources.zip"
          )

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          pnpm exec wxt submit "${args[@]}"

      - name: Create or update GitHub release
        if: ${{ inputs.create_release && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          ASSETS=(
            ".output/avy-tab-switcher-$VERSION-chrome.zip"
            ".output/avy-tab-switcher-$VERSION-firefox.zip"
            ".output/avy-tab-switcher-$VERSION-sources.zip"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."

            gh release upload "$TAG" \
              "${ASSETS[@]}" \
              --clobber
          else
            echo "Creating release $TAG..."

            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --generate-notes
          fi
