name: Publish release

on:
  workflow_call:
    secrets:
      CHROME_EXTENSION_ID:
        required: true
      CHROME_PUBLISHER_ID:
        required: true
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
        required: true
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm package

        - name: Submit to stores
          env:
            VERSION: ${{ steps.release.outputs.version }}

            CHROME_API_VERSION: v2
            CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
            CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
            CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
            CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}

            FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
            FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
            FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
            
            run: |
              pnpm exec wxt submit \
              --chrome-zip ".output/avy-tab-switcher-$VERSION-chrome.zip" \
              --firefox-zip ".output/avy-tab-switcher-$VERSION-firefox.zip" \
              --firefox-sources-zip ".output/avy-tab-switcher-$VERSION-sources.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')

          gh release create "v$VERSION" \
            ".output/avy-tab-switcher-$VERSION-chrome.zip" \
            ".output/avy-tab-switcher-$VERSION-firefox.zip" \
            ".output/avy-tab-switcher-$VERSION-sources.zip" \
            --generate-notes
