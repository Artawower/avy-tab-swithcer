name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Verify release tag matches package.json version
        run: |
          package_version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match 'v$package_version'" >&2
            exit 1
          fi
          echo "Tag '$GITHUB_REF_NAME' matches package.json version."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: just check

      - name: Install Playwright Chromium with dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: just e2e

      - name: Package extension archives
        run: just package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
